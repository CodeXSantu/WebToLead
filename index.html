    <script src="https://www.google.com/recaptcha/api.js"></script>

    <!-- Salesforce reCAPTCHA timestamp -->
    <script>
        function timestamp() {

            var response =
                document.getElementById("g-recaptcha-response");

            if (
                response == null ||
                response.value.trim() == ""
            ) {

                var elems = JSON.parse(
                    document.getElementsByName(
                        "captcha_settings"
                    )[0].value
                );

                elems["ts"] =
                    JSON.stringify(new Date().getTime());

                document.getElementsByName(
                    "captcha_settings"
                )[0].value =
                    JSON.stringify(elems);
            }
        }

        setInterval(timestamp, 500);
    </script>

<!-- =============================================================
     JAVASCRIPT VALIDATION
     ============================================================= -->

<script>

function validateForm() {

    var isValid = true;


    /*
     * Get values
     */

    var firstName =
        document.getElementById("first_name").value.trim();

    var lastName =
        document.getElementById("last_name").value.trim();

    var email =
        document.getElementById("email").value.trim();

    var company =
        document.getElementById("company").value.trim();

    var phone =
        document.getElementById("phone").value.trim();

    var city =
        document.getElementById("city").value.trim();

    var state =
        document.getElementById("state").value.trim();


    /*
     * Hide all errors
     */

    var errors =
        document.querySelectorAll(".error");

    errors.forEach(function(error) {
        error.style.display = "none";
    });


    /*
     * Name validation
     */

    var namePattern =
        /^[A-Za-zÀ-ÿ ]+$/;


    if (
        firstName === "" ||
        !namePattern.test(firstName)
    ) {

        document.getElementById(
            "firstNameError"
        ).style.display = "block";

        isValid = false;
    }


    if (
        lastName === "" ||
        !namePattern.test(lastName)
    ) {

        document.getElementById(
            "lastNameError"
        ).style.display = "block";

        isValid = false;
    }


    /*
     * Email validation
     */

    var emailPattern =
        /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


    if (
        email === "" ||
        !emailPattern.test(email)
    ) {

        document.getElementById(
            "emailError"
        ).style.display = "block";

        isValid = false;
    }


    /*
     * Company validation
     */

    if (company === "") {

        document.getElementById(
            "companyError"
        ).style.display = "block";

        isValid = false;
    }


    /*
     * Phone validation
     */

    if (phone !== "") {

        var phonePattern =
            /^[0-9+() -]{7,20}$/;

        if (!phonePattern.test(phone)) {

            document.getElementById(
                "phoneError"
            ).style.display = "block";

            isValid = false;
        }
    }


    /*
     * City validation
     */

    if (city === "") {

        document.getElementById(
            "cityError"
        ).style.display = "block";

        isValid = false;
    }


    /*
     * State validation
     */

    if (state === "") {

        document.getElementById(
            "stateError"
        ).style.display = "block";

        isValid = false;
    }


    /*
     * reCAPTCHA validation
     */

    var captchaResponse =
        grecaptcha.getResponse();


    if (captchaResponse.length === 0) {

        document.getElementById(
            "captchaError"
        ).style.display = "block";

        isValid = false;
    }


    return isValid;
}

</script>
